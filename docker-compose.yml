services:
  # ----------------------------------------------------------------------------
  # GigaHub Mobile (React SPA servida por Nginx Alpine para Capacitor Live Remote)
  # ----------------------------------------------------------------------------
  gigahub-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gigahub-mobile
    restart: unless-stopped
    networks:
      - gigahub-network
    ports:
      - "3200:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gigahub-mobile.entrypoints=websecure"
      - "traefik.http.routers.gigahub-mobile.rule=Host(`mobile.gigahub.site`)"
      - "traefik.http.routers.gigahub-mobile.tls.certresolver=letsencrypt"
      - "traefik.http.services.gigahub-mobile.loadbalancer.server.port=80"

networks:
  gigahub-network:
    external: true
